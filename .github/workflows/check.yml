name: Validate website
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: git diff --exit-code -- '*.html' sitemap.xml feed.xml en/feed.xml
      - run: python scripts/check.py
      - run: node --check assets/app.js && node --check assets/game.js && node --check assets/config.js
      - run: node tests/game.test.cjs
